name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Run Build
      run: |
        # الانتقال التلقائي للمجلد الذي يحتوي على إعدادات أندرويد
        TARGET_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
        cd "$TARGET_DIR"
        
        # إنشاء ملفات تشغيل gradle تلقائياً على السيرفر لمنع خطأ 127
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IPTVPlayer
        path: "**/build/outputs/apk/debug/app-debug.apk"
